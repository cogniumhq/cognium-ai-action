name: Cognium AI Security Scan
author: Cognium
description: Run cognium-ai SAST and publish SARIF results to GitHub code scanning.

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Path to scan, relative to the repository root.
    required: false
    default: .
  package-version:
    description: npm version of cognium-ai to install.
    required: false
    default: "4.28.0"
  mode:
    description: Scan mode. Use static for deterministic scanning, llm for LLM enrichment and verification, enrich for LLM enrichment without the verification pass, or verify for the LLM verification pass.
    required: false
    default: static
  language:
    description: Optional language filter such as java, javascript, typescript, python, rust, or bash. Use auto for all supported languages.
    required: false
    default: auto
  upload-sarif:
    description: Upload SARIF results to GitHub code scanning.
    required: false
    default: "true"
  json-output:
    description: Also generate a native cognium-ai JSON result file. This runs a second scan.
    required: false
    default: "false"
  fail-on-findings:
    description: Fail the job when one or more findings are reported.
    required: false
    default: "false"
  llm-base-url:
    description: OpenAI-compatible LLM base URL. Required only when mode is llm unless configured through environment variables.
    required: false
    default: ""
  llm-api-key:
    description: LLM API key. Pass it from secrets.* (for example secrets.LLM_API_KEY or secrets.GITHUB_TOKEN). The runner prints a step's env block before the step runs, and only values from secrets.* are hidden there; a key from vars.*, a step output, or a literal is shown in the job log.
    required: false
    default: ""
  llm-model:
    description: LLM model name used when mode is llm.
    required: false
    default: ""
  file-timeout:
    description: Per-file scan timeout in seconds.
    required: false
    default: "30"
  max-files:
    description: Optional maximum number of files to scan.
    required: false
    default: ""
  categories:
    description: Optional comma-separated category filters passed to cognium-ai.
    required: false
    default: ""
  extra-args:
    description: Additional cognium-ai scan arguments. Keep this for trusted workflow configuration only.
    required: false
    default: ""

outputs:
  sarif-file:
    description: Path to the generated SARIF file.
    value: ${{ steps.scan.outputs.sarif-file }}
  json-file:
    description: Path to the native cognium-ai JSON result file when json-output is true.
    value: ${{ steps.scan.outputs.json-file }}
  findings-total:
    description: Total findings parsed from cognium-ai output.
    value: ${{ steps.scan.outputs.findings-total }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Run cognium-ai
      id: scan
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_LLM_BASE_URL: ${{ inputs.llm-base-url }}
        INPUT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        INPUT_LLM_MODEL: ${{ inputs.llm-model }}
        INPUT_FILE_TIMEOUT: ${{ inputs.file-timeout }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_CATEGORIES: ${{ inputs.categories }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: cognium-ai

    - name: Enforce findings policy
      if: ${{ inputs.fail-on-findings == 'true' && steps.scan.outputs.findings-total != '0' }}
      shell: bash
      run: |
        echo "cognium-ai reported ${{ steps.scan.outputs.findings-total }} finding(s)."
        exit 1
